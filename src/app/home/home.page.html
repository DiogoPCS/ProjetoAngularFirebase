<ion-content [fullscreen]="true">
    <!-- {{}} ->  -->
    <ion-row *ngFor="let tarefa of this.projeto">
        <ion-col>Descrição: {{ tarefa.descricao }}</ion-col> 
        <ion-col>Local: {{ tarefa.local }}</ion-col>
        <ion-col>Horário de Inicio: {{ tarefa.hora_inicio }}</ion-col>
        <ion-col>Horário de Término: {{ tarefa.hora_termino }}</ion-col>
        <ion-col *ngIf="tarefa.status == 'Em espera'" style="color: orange">Status: {{ tarefa.status  }}</ion-col>
        <ion-col *ngIf="tarefa.status == 'Concluído'" style="color: green">Status: {{ tarefa.status  }}</ion-col>
        <ion-col *ngIf="tarefa.status == 'Em andamento'" style="color: blue">Status: {{ tarefa.status  }}</ion-col>
    </ion-row>
    
    
    
</ion-content>
