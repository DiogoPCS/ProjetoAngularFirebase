<ion-content [fullscreen]="true">

    <ion-row *ngFor="let tarefa of this.projeto">
        <ion-col>descrição do projeto: {{tarefa.descricao}}</ion-col>
        <ion-col>local:  {{tarefa.local}}</ion-col>
        <ion-col>horario do inicio:  {{tarefa.hora_inicio}} </ion-col>
        <ion-col>horario do termino:  {{tarefa.hora_termino}}></ion-col>
        <ion-col>status :  {{tarefa.status}}></ion-col>
    </ion-row>

   
    
    
</ion-content>
