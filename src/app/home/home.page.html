<ion-content [fullscreen]="true">
    
    <ion-list>
        <ng-container *ngFor="let book of this.livros">
            <ion-item>
                <ion-label>Título: {{book.titulo}}</ion-label>
            </ion-item>
            <ion-item>
                <ion-label>Sinopse: {{book.sinopse}}</ion-label>
            </ion-item>
            <ion-item>
                <ion-label>Número de Páginas: {{book.paginas}}</ion-label>
            </ion-item>
            <ion-item>
                <ion-label>Categorias</ion-label>
                <ng-container *ngFor="let categoria of book.categoria">
                    <h3 *ngIf="categoria.nome == 'Científico'" style="color: red">{{categoria.nome}</h3>
                </ng-container>
            </ion-item>
            
        </ng-container>    
    </ion-list>
    
</ion-content>
