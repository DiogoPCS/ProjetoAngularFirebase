<ion-content [fullscreen]="true">
  <ion-row>

    <ion-col size="2" style="background-color: #1a237e; color: white;">
      <ion-row>
        <ion-col size="12">
          <ion-item lines="none">Início</ion-item>
          <ion-item lines="none">Nossos Pets</ion-item>
          <ion-item lines="none">Quem Somos</ion-item>
          <ion-item lines="none">Contato</ion-item>
        </ion-col>
      </ion-row>
    </ion-col>

    <ion-col size="10">
      <ion-row>

        <ion-col size="6">
          <ion-card>
            <ion-card-header>
              <ion-card-title class="ion-margin-horizontal">Bolinha</ion-card-title>
            </ion-card-header>
            <ion-card-content>
              <ion-text class="ion-margin-horizontal">Carinhoso e dorminhoco</ion-text>
              <ion-button color="warning" class="ion-margin-horizontal">Adotar</ion-button>
            </ion-card-content>
            <ion-img
              src="https://images.unsplash.com/photo-1558788353-f76d92427f16?auto=format&fit=crop&w=800&q=60"
              class="ion-margin dog-img">
            </ion-img>
          </ion-card>
        </ion-col>

        <ion-col size="6">
          <ion-card>
            <ion-card-header>
              <ion-card-title class="ion-margin-horizontal">Luna</ion-card-title>
            </ion-card-header>
            <ion-card-content>
              <ion-text class="ion-margin-horizontal">Brincalhona e inteligente</ion-text>
              <ion-button color="warning" class="ion-margin-horizontal">Adotar</ion-button>
            </ion-card-content>
            <ion-img
              src="https://images.unsplash.com/photo-1560807707-8cc77767d783?auto=format&fit=crop&w=800&q=60"
              class="ion-margin dog-img">
            </ion-img>
          </ion-card>
        </ion-col>

        <ion-col size="6">
          <ion-card>
            <ion-card-header>
              <ion-card-title class="ion-margin-horizontal">Thor</ion-card-title>
            </ion-card-header>
            <ion-card-content>
              <ion-text class="ion-margin-horizontal">Fiel e protetor</ion-text>
              <ion-button color="warning" class="ion-margin-horizontal">Adotar</ion-button>
            </ion-card-content>
            <ion-img
              src="https://images.unsplash.com/photo-1558788353-f76d92427f16?auto=format&fit=crop&w=800&q=60"
              class="ion-margin dog-img">
            </ion-img>
          </ion-card>
        </ion-col>

      
        <ion-col size="6">
          <ion-card>
            <ion-card-header>
              <ion-card-title class="ion-margin-horizontal">Mel</ion-card-title>
            </ion-card-header>
            <ion-card-content>
              <ion-text class="ion-margin-horizontal">Doce e companheira</ion-text>
              <ion-button color="warning" class="ion-margin-horizontal">Adotar</ion-button>
            </ion-card-content>
            <ion-img
              src="https://images.unsplash.com/photo-1560807707-8cc77767d783?auto=format&fit=crop&w=800&q=60"
              class="ion-margin dog-img">
            </ion-img>
          </ion-card>
        </ion-col>

      </ion-row>
    </ion-col>

  </ion-row>
</ion-content>
